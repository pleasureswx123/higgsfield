name: CI / Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Code and CI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements.txt
      - run: python -m pip install -r .github/requirements.txt
      - name: Python lint and format
        run: |
          ruff check ruoyi-fastapi-backend ruoyi-fastapi-test .github/scripts .github/tests
          ruff format --check ruoyi-fastapi-backend ruoyi-fastapi-test .github/scripts .github/tests
      - name: Test CI routing, failure gates and deployment contracts
        run: python -m pytest .github/tests -q --junitxml=target/ci/quality.xml
      - name: Validate every Compose framework selection
        run: python .github/scripts/check_compose.py
      - name: 校验 GitHub Actions 工作流
        run: bash .github/scripts/check_workflows.sh
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: ruoyi-fastapi-frontend/react/web/package.json
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-format-${{ hashFiles('ruoyi-fastapi-frontend/*/*/pnpm-lock.yaml') }}
      - name: Check frontend formatting
        run: |
          for framework in vue2 vue3 react; do
            for target in web mobile; do
              (cd "ruoyi-fastapi-frontend/$framework/$target" && pnpm dlx prettier@3.9.10 --check .)
            done
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quality-reports
          path: target/ci/
          retention-days: 7
